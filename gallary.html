<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Event Image Gallery</title>
</head>

<body>

    <header>
        <h1>College Event Image Gallery</h1>
        <p>Highlights from our annual college cultural event.</p>
    </header>

    <main>
        <section>
            <h2>Event Highlights</h2>

            <figure>
                <img src="opening.jpg"
                     alt="Students gathered in the college auditorium during the event opening"
                     width="300"
                     height="200">
                <figcaption>Students attending the opening ceremony.</figcaption>
            </figure>

            <figure>
                <img src="dance.jpg"
                     alt="College students performing a group dance on the decorated stage"
                     width="300"
                     height="200">
                <figcaption>Students performing a group dance.</figcaption>
            </figure>

            <figure>
                <img src="prize.jpg"
                     alt="College teacher presenting a trophy to a student during the prize ceremony"
                     width="300"
                     height="200">
                <figcaption>Prize distribution ceremony.</figcaption>
            </figure>

            <figure>
                <img src="audience.jpg"
                     alt="Audience watching cultural performances in the college auditorium"
                     width="300"
                     height="200">
                <figcaption>Audience enjoying the cultural performances.</figcaption>
            </figure>

        


    </main>

    <footer>
        <p>&copy; 2026 College Cultural Event</p>
    </footer>

</body>
</html>
