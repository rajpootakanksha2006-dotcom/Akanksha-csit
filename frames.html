<!DOCTYPE html>
<html>
<head>
    <title>Modern Page Structure</title>
    <style>
        body { margin: 0; font-family: Arial; }
        header { background: #222; color: white; padding: 20px; text-align: center; }
        nav { background: #444; padding: 15px; text-align: center; }
        nav a { color: white; margin: 15px; text-decoration: none; }
        main { display: flex; gap: 20px; padding: 20px; }
        section { flex: 3; background: #eee; padding: 20px; }
        aside { flex: 1; background: #ddd; padding: 20px; }
        article { background: white; padding: 15px; margin-top: 10px; }
        footer { background: #222; color: white; text-align: center; padding: 15px; }

        /* Modern responsive design */
        @media (max-width: 600px) {
            main { flex-direction: column; }
            nav a { display: block; margin: 8px; }
        }
    </style>
</head>

<body>

<header>
    <h1>Modern Website</h1>
</header>

<nav>
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Courses</a>
    <a href="#">Contact</a>
</nav>

<main>
    <section>
        <h2>Main Content</h2>
        <article>
            <h3>Welcome</h3>
            <p>This is the main webpage content.</p>
        </article>
        <article>
            <h3>Features</h3>
            <p>Simple, modern and responsive design.</p>
        </article>
    </section>

    <aside>
        <h3>Sidebar</h3>
        <p>Latest news and useful links.</p>
    </aside>
</main>

<footer>
    <p>&copy; 2026 Modern Website</p>
</footer>

</body>
</html>
